# Active Storage services. STORAGE_PROVIDER in .env picks one: local (default) or s3.
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= ENV.fetch("STORAGE_PATH") { Rails.root.join("storage").to_s } %>

# Any S3-compatible store: AWS S3, Cloudflare R2, Backblaze B2, MinIO (set S3_ENDPOINT).
s3:
  service: S3
  bucket: <%= ENV["S3_BUCKET"] %>
  region: <%= ENV.fetch("S3_REGION", "us-east-1") %>
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  <% if ENV["S3_ENDPOINT"].present? %>
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  <% end %>
  force_path_style: <%= ENV.fetch("S3_FORCE_PATH_STYLE", ENV["S3_ENDPOINT"].present? ? "true" : "false") == "true" %>
