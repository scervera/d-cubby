# Connection strings come from the environment:
#   development  DATABASE_URL from .env.local (loaded by dotenv-rails)
#   test         TEST_DATABASE_URL, or DATABASE_URL in CI (dotenv does not load .env.local in test)
#   production   DATABASE_URL from the Docker Compose .env (written by install.sh)
#
# Solid Queue and Solid Cache share this database (their tables come from db/migrate).
# The pool covers Puma threads plus the Solid Queue worker threads in bin/jobs.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://postgres:postgres@127.0.0.1:5433/d_cubby_development") %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql://postgres:postgres@127.0.0.1:5433/d_cubby_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
