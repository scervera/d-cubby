name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (RSpec + RuboCop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: d_cubby_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/d_cubby_test
      JWT_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (libvips, exiftool, ffmpeg for the dam gem)
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips libimage-exiftool-perl ffmpeg
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/api
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bundle exec rspec
      - run: bundle exec rubocop

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  shell:
    name: Shell scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x install.sh bin/dev bin/dev-stop bin/dev-logs bin/restart apps/api/bin/docker-entrypoint

  install:
    name: Install with Docker (install.sh --non-interactive --build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install
        env:
          APP_HOST: localhost
          HTTP_PORT: "8080"
          APP_VERSION: ci
          WATCHED_MOUNTS: inbox=${{ github.workspace }}/apps/api/lib/integrations
        run: ./install.sh --non-interactive --build
      - name: Check the running stack through Caddy
        run: |
          set -x
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/api/v1/setup | grep -q '"needed":true'
          curl -fsS -o /dev/null http://localhost:8080/login
          token="$(grep '^SETUP_TOKEN=' .env | cut -d"'" -f2)"
          curl -fsS -X POST http://localhost:8080/api/v1/setup -H 'Content-Type: application/json' \
            -d "{\"setup_token\":\"$token\",\"organization\":{\"name\":\"CI\"},\"user\":{\"name\":\"CI Owner\",\"email\":\"ci@example.com\",\"password\":\"ci-password-123\"}}" \
            | grep -q '"token"'
          docker compose exec -T api ls /watched/inbox/sample.png
          ./install.sh --check
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
